awspub:
  s3:
    bucket_name: "bucket1"

  source:
    path: "config1.vmdk"
    architecture: "x86_64"

  images:
    "test-image-1":
      description: |
        A test image with overlapping include and exclude regions for SNS
      boot_mode: "uefi"
      regions:
        - "eu-central-1"
        - "us-east-1"
      sns:
        - "topic1":
            subject: "topic1-subject"
            message:
              default: "default-message"
            regions:
              - "eu-central-1"
              - "us-east-1"
            regions_denylist:
              - "us-east-1"

  tags:
    name: "foobar"
