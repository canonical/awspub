[tox]
minversion = 4.22
requires = tox-uv
# Choose your Python versions. They have to be available
# on the system the tests are run on.
envlist = py3,lint,type

[testenv]
runner = uv-venv-runner
package = editable
dependency_groups = test
setenv =
   PYTHONASYNCIODEBUG=1
commands =
  coverage run -m pytest -s {posargs} --import-mode importlib
  coverage report -m

[testenv:lint]
dependency_groups = test
commands =
  flake8 {posargs}
  black --check --diff --line-length 120 awspub/
  isort --check awspub/

[testenv:type]
dependency_groups = type
commands =
  mypy awspub

[flake8]
show-source = True
exclude = .venv,.tox,dist,doc,build,*.egg,node_modules,tomllib,docs
max-line-length = 120

[testenv:venv]
commands = {posargs}

[testenv:format]
dependency_groups = test
commands =
  black --line-length 120 awspub
  isort awspub
