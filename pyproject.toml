[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "awspub"
dynamic = ["version"]
description = "Publish images to AWS EC2"
readme = "readme.rst"
license = "GPL-3.0-or-later"
authors = [
    { name = "Thomas Bechtold", email = "thomasbechtold@jpberlin.de" },
]
keywords = ["AWS", "EC2", "publication"]
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "pydantic>=2,<3",
    "boto3-stubs[essential,marketplace-catalog,ssm,s3,sns,sts]>=1.28.83,<2",
    "ruamel-yaml>=0.19.0,<0.20",
]

[project.urls]
Homepage = "https://github.com/canonical/awspub"
Repository = "https://github.com/canonical/awspub"

[project.scripts]
awspub = "awspub.cli:main"

[dependency-groups]
test = [
    "flake8",
    "black",
    "pytest",
    "coverage>=7.4.1,<8",
    "isort>=9.0.0,<10",
]
type = [
    "mypy",
    "pytest",
]
doc = [
    "Sphinx",
    "pydantic-settings",
    "autodoc_pydantic>=2.0.1,<3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["awspub"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
